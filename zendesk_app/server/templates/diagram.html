<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AWS 아키텍처 다이어그램</title>
  <style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  overflow: hidden;
}

.diagram-app {
  width: 100%;
  height: 100vh;
  overflow: hidden;
}

.diagram-layout {
  display: flex;
  width: 100%;
  height: 100vh;
}

.diagram-container {
  width: 75%;
  display: flex;
  flex-direction: column;
  background: #f5f5f5;
}

.diagram-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 12px 20px;
  background: white;
  border-bottom: 1px solid #e5e7eb;
  height: 60px;
}

.back-btn {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 8px 16px;
  background: transparent;
  border: 1px solid #e5e7eb;
  border-radius: 6px;
  cursor: pointer;
  font-size: 14px;
  color: #374151;
  transition: all 0.2s;
  text-decoration: none;
}

.back-btn:hover {
  background: #f9fafb;
  border-color: #d1d5db;
}

.back-btn svg {
  width: 20px;
  height: 20px;
}

.diagram-header h2 {
  font-size: 18px;
  font-weight: 600;
  color: #111827;
  margin: 0;
}

.diagram-actions {
  display: flex;
  gap: 8px;
}

.action-btn {
  padding: 8px 16px;
  background: #232f3e;
  color: white;
  border: none;
  border-radius: 6px;
  cursor: pointer;
  font-size: 14px;
  transition: all 0.2s;
}

.action-btn:hover {
  background: #1a2332;
}

.chatbot-sidebar {
  width: 25%;
  display: flex;
  flex-direction: column;
  background: white;
  border-left: 1px solid #e5e7eb;
}

.chatbot-header {
  padding: 20px;
  background: #232f3e;
  color: white;
  border-bottom: 1px solid #e5e7eb;
}

.chatbot-header h3 {
  margin: 0;
  font-size: 16px;
  font-weight: 600;
}

.chatbot-messages {
  flex: 1;
  overflow-y: auto;
  padding: 20px;
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.bot-message, .user-message {
  padding: 12px 16px;
  border-radius: 8px;
  font-size: 14px;
  line-height: 1.5;
  max-width: 90%;
}

.bot-message {
  background: #f3f4f6;
  color: #374151;
  align-self: flex-start;
}

.user-message {
  background: #232f3e;
  color: white;
  align-self: flex-end;
}

.chatbot-input {
  padding: 16px;
  border-top: 1px solid #e5e7eb;
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.chatbot-input textarea {
  width: 100%;
  padding: 12px;
  border: 1px solid #e5e7eb;
  border-radius: 6px;
  font-size: 14px;
  font-family: inherit;
  resize: none;
}

.chatbot-input textarea:focus {
  outline: none;
  border-color: #232f3e;
}

.chatbot-input .send-btn {
  padding: 10px;
  background: #232f3e;
  color: white;
  border: none;
  border-radius: 6px;
  cursor: pointer;
  font-size: 14px;
  font-weight: 500;
  transition: all 0.2s;
}

.chatbot-input .send-btn:hover {
  background: #1a2332;
}

.chatbot-input .send-btn:disabled {
  background: #9ca3af;
  cursor: not-allowed;
}
  </style>
</head>
<body>
<div class="diagram-app">
  <!-- 다이어그램 + 챗봇 레이아웃 -->
  <div class="diagram-layout">
    <!-- Draw.io 영역 (75%) -->
    <div class="diagram-container">
      <div class="diagram-header">
        <button class="back-btn" onclick="window.location.href='/'">
          <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M19 12H5M5 12L12 19M5 12L12 5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          대시보드로
        </button>
        <h2>AWS 아키텍처 다이어그램</h2>
        <div class="diagram-actions">
          <button class="action-btn" id="exportBtn">내보내기</button>
        </div>
      </div>
      <div style="width: 100%; height: calc(100vh - 60px); background: white; display: flex; align-items: center; justify-content: center; flex-direction: column;">
        <iframe id="drawioFrame" src="" style="width: 100%; height: 100%; border: none;"></iframe>
        <div id="loadingIndicator" style="position: absolute; display: none;">
          <p>Draw.io 로딩 중...</p>
        </div>
      </div>
    </div>

    <!-- 챗봇 영역 (25%) -->
    <div class="chatbot-sidebar">
      <div class="chatbot-header">
        <h3>아키텍처 어시스턴트</h3>
      </div>
      <div class="chatbot-messages" id="diagramMessages">
        <div class="bot-message">
          안녕하세요! AWS 아키텍처 다이어그램을 도와드리겠습니다.<br><br>
          <strong>예시:</strong><br>
          • "3-tier 아키텍처 만들어줘"<br>
          • "Lambda 함수 추가해줘"<br>
          • "RDS를 Multi-AZ로 변경해줘"<br>
          • "보안 서비스 추가해줘"
        </div>
      </div>
      <div class="chatbot-input">
        <textarea id="diagramInput" placeholder="다이어그램 요청사항을 입력하세요..." rows="3"></textarea>
        <button id="diagramSendBtn" class="send-btn">전송</button>
      </div>
    </div>
  </div>
</div>

<script>
// WebSocket 연결 (선택적)
let ws = null;
const drawioFrame = document.getElementById('drawioFrame');
const diagramMessages = document.getElementById('diagramMessages');
const diagramInput = document.getElementById('diagramInput');
const diagramSendBtn = document.getElementById('diagramSendBtn');

// Draw.io 기본 빈 다이어그램 XML
const EMPTY_DIAGRAM = '<mxGraphModel><root><mxCell id="0"/><mxCell id="1" parent="0"/></root></mxGraphModel>';

// Draw.io 임베드 URL (데이터 포함)
const DRAWIO_EMBED_URL = 'https://embed.diagrams.net/?embed=1&ui=atlas&libs=aws4&noSaveBtn=1&noExitBtn=1#R' + encodeURIComponent(EMPTY_DIAGRAM);

// 초기화
async function initDiagram() {
  addBotMessage('다이어그램 에디터를 로드하고 있습니다...');
  
  const loadingIndicator = document.getElementById('loadingIndicator');
  if (loadingIndicator) loadingIndicator.style.display = 'block';
  
  console.log('Draw.io URL:', DRAWIO_EMBED_URL);
  
  // 간단한 테스트 - 구글 먼저 로드해보기
  // drawioFrame.src = 'https://www.google.com';
  
  // Draw.io 임베드 로드
  drawioFrame.src = DRAWIO_EMBED_URL;
  
  // iframe 로드 이벤트
  drawioFrame.addEventListener('load', () => {
    console.log('iframe loaded successfully');
    if (loadingIndicator) loadingIndicator.style.display = 'none';
    addBotMessage('Draw.io가 로드되었습니다. 화면이 보이지 않으면 브라우저에서 직접 https://embed.diagrams.net 접근을 확인하세요.');
  });
  
  drawioFrame.addEventListener('error', (e) => {
    console.error('iframe error:', e);
    if (loadingIndicator) loadingIndicator.style.display = 'none';
    addBotMessage('Draw.io 로드 실패. 네트워크 연결을 확인하세요.');
  });
  
  // 타임아웃 체크
  setTimeout(() => {
    if (loadingIndicator && loadingIndicator.style.display !== 'none') {
      addBotMessage('로딩이 오래 걸리고 있습니다. 페이지를 새로고침하거나 네트워크를 확인하세요.');
    }
  }, 10000);
  
  // WebSocket 연결 시도
  try {
    connectWebSocket();
  } catch (e) {
    console.log('WebSocket 연결 실패:', e);
  }
}

function connectWebSocket() {
  const wsUrl = "{{ websocket_url }}".replace(/^http/, 'ws');
  
  try {
    ws = new WebSocket(wsUrl);
    
    ws.onopen = () => {
      console.log('WebSocket 연결됨');
      addBotMessage('AI 어시스턴트가 연결되었습니다.');
    };
    
    ws.onmessage = (event) => {
      const data = JSON.parse(event.data);
      if (data.type === 'diagram_update') {
        addBotMessage('다이어그램이 업데이트되었습니다.');
      } else if (data.type === 'message') {
        addBotMessage(data.content);
      }
    };
    
    ws.onerror = (error) => {
      console.log('WebSocket 연결 실패 (선택적 기능)');
    };
    
    ws.onclose = () => {
      console.log('WebSocket 연결 종료');
    };
  } catch (e) {
    console.log('WebSocket 초기화 실패:', e);
  }
}

function addBotMessage(text) {
  const messageDiv = document.createElement('div');
  messageDiv.className = 'bot-message';
  messageDiv.textContent = text;
  diagramMessages.appendChild(messageDiv);
  diagramMessages.scrollTop = diagramMessages.scrollHeight;
}

function addUserMessage(text) {
  const messageDiv = document.createElement('div');
  messageDiv.className = 'user-message';
  messageDiv.textContent = text;
  diagramMessages.appendChild(messageDiv);
  diagramMessages.scrollTop = diagramMessages.scrollHeight;
}

// 메시지 전송
diagramSendBtn.addEventListener('click', sendMessage);
diagramInput.addEventListener('keypress', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    sendMessage();
  }
});

function sendMessage() {
  const message = diagramInput.value.trim();
  if (!message) return;
  
  addUserMessage(message);
  diagramInput.value = '';
  
  // WebSocket으로 Q CLI에 메시지 전송
  if (ws && ws.readyState === WebSocket.OPEN) {
    ws.send(JSON.stringify({
      type: 'diagram_request',
      content: message
    }));
    addBotMessage('처리 중입니다...');
  } else {
    addBotMessage('WebSocket 연결이 필요합니다. 잠시 후 다시 시도해주세요.');
  }
}

// 내보내기
document.getElementById('exportBtn').addEventListener('click', () => {
  // Draw.io export 기능 호출
  addBotMessage('다이어그램을 내보내는 기능은 곧 추가됩니다.');
});

// 페이지 로드 시 초기화
initDiagram();
</script>
</body>
</html>
