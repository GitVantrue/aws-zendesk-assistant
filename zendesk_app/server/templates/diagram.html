<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AWS 아키텍처 다이어그램</title>
  <style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  overflow: hidden;
}

.diagram-app {
  width: 100%;
  height: 100vh;
  overflow: hidden;
}

.diagram-layout {
  display: flex;
  width: 100%;
  height: 100vh;
}

.diagram-container {
  width: 75%;
  display: flex;
  flex-direction: column;
  background: #f5f5f5;
}

.diagram-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 12px 20px;
  background: white;
  border-bottom: 1px solid #e5e7eb;
  height: 60px;
}

.back-btn {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 8px 16px;
  background: transparent;
  border: 1px solid #e5e7eb;
  border-radius: 6px;
  cursor: pointer;
  font-size: 14px;
  color: #374151;
  transition: all 0.2s;
  text-decoration: none;
}

.back-btn:hover {
  background: #f9fafb;
  border-color: #d1d5db;
}

.back-btn svg {
  width: 20px;
  height: 20px;
}

.diagram-header h2 {
  font-size: 18px;
  font-weight: 600;
  color: #111827;
  margin: 0;
}

.diagram-actions {
  display: flex;
  gap: 8px;
}

.action-btn {
  padding: 8px 16px;
  background: #232f3e;
  color: white;
  border: none;
  border-radius: 6px;
  cursor: pointer;
  font-size: 14px;
  transition: all 0.2s;
}

.action-btn:hover {
  background: #1a2332;
}

.chatbot-sidebar {
  width: 25%;
  display: flex;
  flex-direction: column;
  background: white;
  border-left: 1px solid #e5e7eb;
}

.chatbot-header {
  padding: 20px;
  background: #232f3e;
  color: white;
  border-bottom: 1px solid #e5e7eb;
}

.chatbot-header h3 {
  margin: 0;
  font-size: 16px;
  font-weight: 600;
}

.chatbot-messages {
  flex: 1;
  overflow-y: auto;
  padding: 20px;
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.bot-message, .user-message {
  padding: 12px 16px;
  border-radius: 8px;
  font-size: 14px;
  line-height: 1.5;
  max-width: 90%;
}

.bot-message {
  background: #f3f4f6;
  color: #374151;
  align-self: flex-start;
}

.user-message {
  background: #232f3e;
  color: white;
  align-self: flex-end;
}

.chatbot-input {
  padding: 16px;
  border-top: 1px solid #e5e7eb;
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.chatbot-input textarea {
  width: 100%;
  padding: 12px;
  border: 1px solid #e5e7eb;
  border-radius: 6px;
  font-size: 14px;
  font-family: inherit;
  resize: none;
}

.chatbot-input textarea:focus {
  outline: none;
  border-color: #232f3e;
}

.chatbot-input .send-btn {
  padding: 10px;
  background: #232f3e;
  color: white;
  border: none;
  border-radius: 6px;
  cursor: pointer;
  font-size: 14px;
  font-weight: 500;
  transition: all 0.2s;
}

.chatbot-input .send-btn:hover {
  background: #1a2332;
}

.chatbot-input .send-btn:disabled {
  background: #9ca3af;
  cursor: not-allowed;
}
  </style>
</head>
<body>
<div class="diagram-app">
  <!-- 다이어그램 + 챗봇 레이아웃 -->
  <div class="diagram-layout">
    <!-- Draw.io 영역 (75%) -->
    <div class="diagram-container">
      <div class="diagram-header">
        <button class="back-btn" onclick="window.location.href='/'">
          <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M19 12H5M5 12L12 19M5 12L12 5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          대시보드로
        </button>
        <h2>AWS 아키텍처 다이어그램</h2>
        <div class="diagram-actions">
          <button class="action-btn" id="exportBtn">내보내기</button>
        </div>
      </div>
      <!-- Draw.io iframe 영역 -->
      <iframe id="drawioFrame"
              src="https://embed.diagrams.net/?embed=1&ui=min&libraries=1&saveAndExit=0&noSaveBtn=1&noExitBtn=1&libs=aws4"
              style="width: 100%; height: calc(100vh - 60px); border: none; background: white;"
              allow="fullscreen">
      </iframe>
    </div>

    <!-- 챗봇 영역 (25%) -->
    <div class="chatbot-sidebar">
      <div class="chatbot-header">
        <h3>아키텍처 어시스턴트</h3>
      </div>
      <div class="chatbot-messages" id="diagramMessages">
        <div class="bot-message">
          안녕하세요! AWS 아키텍처 다이어그램을 도와드리겠습니다.<br><br>
          <strong>예시:</strong><br>
          • "3-tier 아키텍처 만들어줘"<br>
          • "Lambda 함수 추가해줘"<br>
          • "RDS를 Multi-AZ로 변경해줘"<br>
          • "보안 서비스 추가해줘"
        </div>
      </div>
      <div class="chatbot-input">
        <textarea id="diagramInput" placeholder="다이어그램 요청사항을 입력하세요..." rows="3"></textarea>
        <button id="diagramSendBtn" class="send-btn">전송</button>
      </div>
    </div>
  </div>
</div>

<script>
// WebSocket 연결 (선택적)
let ws = null;
const drawioFrame = document.getElementById('drawioFrame');
const diagramMessages = document.getElementById('diagramMessages');
const diagramInput = document.getElementById('diagramInput');
const diagramSendBtn = document.getElementById('diagramSendBtn');

// 스트리밍 청크 누적 버퍼
let streamingBuffer = '';
let isStreaming = false;

// 초기화
async function initDiagram() {
  addBotMessage('다이어그램 생성 준비 완료!');
  addBotMessage('챗봇에 "3-tier 아키텍처 만들어줘" 같은 요청을 입력하세요.');
  
  // Draw.io iframe 로드 확인
  const iframe = document.getElementById('drawioFrame');
  if (iframe) {
    iframe.onload = () => {
      console.log('Draw.io iframe 로드 완료');
      addBotMessage('✅ Draw.io 에디터가 준비되었습니다.');
    };
    
    iframe.onerror = () => {
      console.error('Draw.io iframe 로드 실패');
      addBotMessage('❌ Draw.io 로드 실패. 네트워크를 확인하세요.');
    };
  }
  
  // WebSocket 연결 시도
  try {
    connectWebSocket();
  } catch (e) {
    console.log('WebSocket 연결 실패:', e);
  }
}

function connectWebSocket() {
  // 템플릿에서 전달받은 WebSocket URL 사용
  const wsUrl = "{{ websocket_url }}".replace(/^http/, 'ws');
  
  console.log('WebSocket 연결 시도:', wsUrl);
  
  try {
    ws = new WebSocket(wsUrl);
    
    ws.onopen = () => {
      console.log('WebSocket 연결 성공!');
      addBotMessage('✅ AI 어시스턴트가 연결되었습니다. 이제 다이어그램 요청을 입력하세요.');
    };
    
    ws.onmessage = (event) => {
      console.log('메시지 수신:', event.data);
      const data = JSON.parse(event.data);
      
      // Draw.io XML 수신 (별도 메시지)
      if (data.type === 'diagram_xml' && data.xml) {
        console.log('=== 다이어그램 XML 수신 ===');
        console.log('XML 타입:', typeof data.xml);
        console.log('XML 길이:', data.xml.length);
        console.log('XML 첫 100자:', data.xml.substring(0, 100));
        
        loadDiagramXML(data.xml);
      }
      // 스트리밍 시작
      else if (data.type === 'streaming_start') {
        console.log('=== 스트리밍 시작 ===');
        streamingBuffer = '';
        isStreaming = true;
      }
      // 스트리밍 청크 수신 - 실시간 누적
      else if (data.type === 'streaming_chunk') {
        if (isStreaming) {
          streamingBuffer += data.chunk;
          
          // 주기적으로 XML 완성 여부 체크 (매 10번째 청크마다)
          if (data.chunk_index % 10 === 0) {
            checkAndLoadXML();
          }
        }
      }
      // 스트리밍 완료
      else if (data.type === 'streaming_complete') {
        console.log('=== 스트리밍 완료 ===');
        isStreaming = false;
        
        // 최종 XML 추출 시도
        if (data.data && data.data.answer) {
          streamingBuffer = data.data.answer;
        }
        
        checkAndLoadXML();
      } 
      else if (data.type === 'progress') {
        addBotMessage(data.message);
      }
      else if (data.type === 'message') {
        addBotMessage(data.content);
      }
    };
    
    ws.onerror = (error) => {
      console.error('WebSocket 에러:', error);
      addBotMessage('❌ WebSocket 연결 실패. 서버를 확인하세요.');
    };
    
    ws.onclose = () => {
      console.log('WebSocket 연결 종료');
    };
  } catch (e) {
    console.error('WebSocket 초기화 실패:', e);
    addBotMessage('WebSocket 초기화 실패: ' + e.message);
  }
}

function addBotMessage(text) {
  const messageDiv = document.createElement('div');
  messageDiv.className = 'bot-message';
  messageDiv.textContent = text;
  diagramMessages.appendChild(messageDiv);
  diagramMessages.scrollTop = diagramMessages.scrollHeight;
}

function addUserMessage(text) {
  const messageDiv = document.createElement('div');
  messageDiv.className = 'user-message';
  messageDiv.textContent = text;
  diagramMessages.appendChild(messageDiv);
  diagramMessages.scrollTop = diagramMessages.scrollHeight;
}

// XML 추출 및 로드 함수
function checkAndLoadXML() {
  if (!streamingBuffer) return;
  
  // </mxfile>이 있는지 확인 (완성 여부)
  if (!streamingBuffer.includes('</mxfile>')) {
    console.log('XML 아직 불완전 (</mxfile> 없음), 버퍼 길이:', streamingBuffer.length);
    return;
  }
  
  console.log('=== XML 추출 시도 ===');
  console.log('버퍼 길이:', streamingBuffer.length);
  console.log('버퍼 첫 200자:', streamingBuffer.substring(0, 200));
  
  let xmlContent = null;
  
  // 패턴 1: 직접 <?xml로 시작 (가장 단순)
  if (streamingBuffer.includes('<?xml')) {
    const xmlMatch1 = streamingBuffer.match(/(<\?xml[\s\S]*?<\/mxfile>)/);
    if (xmlMatch1) {
      xmlContent = xmlMatch1[1].trim();
      console.log('패턴 1 매칭 성공: <?xml...mxfile>');
    }
  }
  
  // 패턴 2: xml<?xml ... (Q CLI 응답 형식 - 줄바꿈 없음)
  if (!xmlContent && streamingBuffer.includes('xml<?xml')) {
    const xmlMatch2 = streamingBuffer.match(/xml\s*(<\?xml[\s\S]*?<\/mxfile>)/);
    if (xmlMatch2) {
      xmlContent = xmlMatch2[1].trim();
      console.log('패턴 2 매칭 성공: xml<?xml...mxfile> (줄바꿈 없음)');
    }
  }
  
  // 패턴 3: xml\n<?xml ... (Q CLI 응답 형식 - 줄바꿈 있음)
  if (!xmlContent) {
    const xmlMatch3 = streamingBuffer.match(/xml\s*\n\s*(<\?xml[\s\S]*?<\/mxfile>)/);
    if (xmlMatch3) {
      xmlContent = xmlMatch3[1].trim();
      console.log('패턴 3 매칭 성공: xml\\n<?xml...mxfile>');
    }
  }
  
  // 패턴 4: ```xml ... ``` (백틱 포함)
  if (!xmlContent) {
    const xmlMatch4 = streamingBuffer.match(/```xml\s*(<\?xml[\s\S]*?<\/mxfile>)\s*```/);
    if (xmlMatch4) {
      xmlContent = xmlMatch4[1].trim();
      console.log('패턴 4 매칭 성공: ```xml...```');
    }
  }
  
  // XML이 완성되었으면 로드
  if (xmlContent) {
    console.log('=== XML 추출 성공 ===');
    console.log('XML 길이:', xmlContent.length);
    console.log('XML 첫 100자:', xmlContent.substring(0, 100));
    console.log('XML이 <?xml로 시작하는지:', xmlContent.startsWith('<?xml'));
    
    loadDiagramXML(xmlContent);
    
    // 버퍼 초기화 (중복 로드 방지)
    streamingBuffer = '';
  } else {
    console.log('XML 추출 실패 - 패턴 매칭 안됨');
  }
}

// Draw.io에 XML 로드
function loadDiagramXML(xmlContent) {
  if (!drawioReady) {
    console.log('Draw.io 아직 준비 안됨, XML 대기 중');
    pendingXML = xmlContent;
    return;
  }
  
  loadDiagramXMLNow(xmlContent);
}

// 실제 XML 로드 함수
function loadDiagramXMLNow(xmlContent) {
  const iframe = document.getElementById('drawioFrame');
  if (iframe && iframe.contentWindow) {
    console.log('=== Draw.io에 XML 로드 시작 ===');
    console.log('XML 전체 내용:');
    console.log(xmlContent);
    console.log('=== XML 끝 ===');
    
    const message = {
      action: 'load',
      autosave: 1,
      xml: xmlContent
    };
    
    iframe.contentWindow.postMessage(message, '*');
    
    console.log('Draw.io에 XML 전송 완료');
    addBotMessage('✅ 다이어그램이 로드되었습니다!');
  } else {
    console.error('Draw.io iframe을 찾을 수 없거나 contentWindow가 없습니다');
  }
}

// 메시지 전송
diagramSendBtn.addEventListener('click', sendMessage);
diagramInput.addEventListener('keypress', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    sendMessage();
  }
});

function sendMessage() {
  const message = diagramInput.value.trim();
  if (!message) return;
  
  addUserMessage(message);
  diagramInput.value = '';
  
  // WebSocket으로 Q CLI에 메시지 전송
  if (ws && ws.readyState === WebSocket.OPEN) {
    ws.send(JSON.stringify({
      type: 'diagram_request',
      content: message
    }));
    addBotMessage('처리 중입니다...');
  } else {
    addBotMessage('WebSocket 연결이 필요합니다. 잠시 후 다시 시도해주세요.');
  }
}

// 내보내기
document.getElementById('exportBtn').addEventListener('click', () => {
  // Draw.io export 기능 호출
  addBotMessage('다이어그램을 내보내는 기능은 곧 추가됩니다.');
});

// 페이지 로드 시 초기화
initDiagram();

// Draw.io iframe에서 오는 메시지 수신 (디버깅용)
let drawioReady = false;
let pendingXML = null;

window.addEventListener('message', (event) => {
  // Draw.io에서 오는 메시지만 로깅
  if (event.origin === 'https://embed.diagrams.net') {
    console.log('Draw.io로부터 메시지 수신:', event.data);
    
    // Draw.io가 ready 상태가 되면
    if (event.data === 'ready') {
      drawioReady = true;
      console.log('Draw.io ready 상태 확인');
      
      // 대기 중인 XML이 있으면 로드
      if (pendingXML) {
        console.log('대기 중인 XML 로드 시작');
        loadDiagramXMLNow(pendingXML);
        pendingXML = null;
      } else {
        // 빈 다이어그램 초기화
        const iframe = document.getElementById('drawioFrame');
        if (iframe && iframe.contentWindow) {
          const emptyDiagram = `<?xml version="1.0" encoding="UTF-8"?>
<mxfile host="embed.diagrams.net" modified="2024-01-01T00:00:00.000Z" agent="5.0" version="22.0.0">
  <diagram name="AWS Architecture" id="aws-arch">
    <mxGraphModel dx="1422" dy="794" grid="1" gridSize="10" guides="1" tooltips="1" connect="1" arrows="1" fold="1" page="1" pageScale="1" pageWidth="850" pageHeight="1100">
      <root>
        <mxCell id="0"/>
        <mxCell id="1" parent="0"/>
      </root>
    </mxGraphModel>
  </diagram>
</mxfile>`;
          
          iframe.contentWindow.postMessage({
            action: 'load',
            autosave: 1,
            xml: emptyDiagram
          }, '*');
          
          console.log('빈 다이어그램 초기화 완료');
          addBotMessage('📐 Draw.io 캔버스가 준비되었습니다!');
        }
      }
    }
  }
});
</script>
</body>
</html>
